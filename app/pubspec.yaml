name: riv
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

resolution: workspace
environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter

  api_bindings:
    path: ../libs/api_bindings

  flutter_titlebar:
    path: ../libs/flutter_titlebar 
  
  signalr_netcore: # ^1.4.4
    path: ../libs/signalr_client

  cupertino_icons: ^1.0.8
  hooks_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  riverpod_sqflite: ^0.4.7
  riverpod_devtools: ^1.1.2
  flutter_hooks: ^0.21.3+1
  auto_route: ^11.1.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  desktop_drop: ^0.7.0
  # super_clipboard: ^0.9.1
  intl: any
  flutter_localizations:
    sdk: flutter
  darq: ^2.1.0
  scaled_app: ^2.3.0
  dio: '^5.11.0'
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  skeletonizer: ^2.1.3
  flutter_markdown_plus: ^1.0.12
  logging: ^1.3.0
  file_picker: ^12.3.0
  flutter_context_menu: ^0.4.2
  sqflite: ^2.4.3
  path: ^1.9.1
  markdown: ^7.3.1
  sqflite_db_inspector: ^0.1.6
  shared_preferences: 2.5.5
  reactive_forms: ^18.2.2
  copy_with_extension: ^17.1.0
  stack_trace: ^1.12.2
  theme_extensions_builder_annotation: ^7.5.0
  cue: ^0.4.0
  
dev_dependencies:
  # flutter_test:
  #   sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: any
  riverpod_generator: ^4.0.9
  auto_route_generator: ^10.6.0
  freezed: ^4.0.0
  json_serializable: ^6.14.1
  flutter_gen_runner: ^5.12.0
  json_convert_gen:
    path: ../libs/json_convert_gen
  copy_with_extension_gen: ^17.1.0
  theme_extensions_builder: ^7.5.0

plugins:
  riverpod_lint: 3.1.4

flutter:
  generate: true
  uses-material-design: true

  shaders:
    - assets/shaders/hex.frag
    - assets/shaders/triangles.frag
    - assets/shaders/ring.frag
    # - assets/shaders/glass.frag
    - assets/shaders/glass2.frag
    - assets/shaders/glass3.frag


  assets:
    - lib/riverpod_dependencies.json
    - assets/images/background.svg
    - assets/images/logo.svg

  fonts:
    - family: RedHatDisplay
      fonts:
        - asset: assets/fonts/RedHatDisplay-VariableFont_wght.ttf
        - asset: assets/fonts/RedHatDisplay-Italic-VariableFont_wght.ttf
          style: italic
    - family: RedHatText
      fonts:
        - asset: assets/fonts/RedHatText-VariableFont_wght.ttf
        - asset: assets/fonts/RedHatText-Italic-VariableFont_wght.ttf
          style: italic
    - family: RedHatMono
      fonts:
        - asset: assets/fonts/RedHatMono-VariableFont_wght.ttf
        - asset: assets/fonts/RedHatMono-Italic-VariableFont_wght.ttf
          style: italic
