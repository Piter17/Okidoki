targets:
  $default:
    builders:
      flutter_gen_runner: # or flutter_gen
          options:
            output: lib/gen/ # Optional (default: lib/gen/)
            line_length: 120 # Optional
      json_convert_gen:
        options:
          output: lib/gen/json_decoder.dart
          class_name: JsonDecoder
      flutter_intl:
        options:
          l10n:
            l10n-path: l10n.yaml