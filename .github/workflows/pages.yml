name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - stage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --force-jit

      - name: Select env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "API_URL=https://api.okidoki.fun/" >> $GITHUB_ENV
            echo "APP_URL=https://okidoki.fun/" >> $GITHUB_ENV
            echo "PROJECT_NAME=okidoki" >> $GITHUB_ENV
          else
            echo "API_URL=https://api-dev.okidoki.fun/" >> $GITHUB_ENV
            echo "APP_URL=https://test.okidoki.fun/" >> $GITHUB_ENV
            echo "PROJECT_NAME=okidoki-test" >> $GITHUB_ENV
          fi

      - name: Build web
        run: flutter build web --release --wasm --dart-define=API_URL=${API_URL} --dart-define=APP_URL=$APP_URL

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./app/build/web --project-name=$PROJECT_NAME
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}