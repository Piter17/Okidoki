name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches:
      - main
      - stage
      
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: app

    env:
      API_URL: ${{ secrets.API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install API bindings depende  ncies
        run: dart pub get
        working-directory: libs/api_bindings

      - name: Build API bindings
        run: dart run build_runner build --delete-conflicting-outputs
        working-directory: libs/api_bindings

      - name: Select API URL
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "API_URL=https://api.okidoki.fun" >> $GITHUB_ENV
          else
            echo "API_URL=https://api-dev.okidoki.fun" >> $GITHUB_ENV
          fi

      - name: Build web
        run: flutter build web --release --wasm --dart-define=API_URL=$API_URL

      - name: Select cloudflare project
        id: project
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "name=okidoki" >> $GITHUB_OUTPUT
          else
            echo "name=okidoki-test" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy YOUR_DIRECTORY_OF_STATIC_ASSETS --project-name=${{ steps.project.outputs.name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}